name: tickoff_clone
description: A TickOff-style habit tracker built on Flutter + Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1

  # UI helpers
  table_calendar: ^3.1.2          # calendar for backdating + monthly view
  fl_chart: ^0.68.0               # streak / stats charts
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # Media
  image_picker: ^1.1.2

  # Android home-screen widget bridge
  home_widget: ^0.6.0

  # Local notifications for habit reminders
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
